name: Deploy Akari Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out website
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage public files
        run: |
          # Everything in site/ is public. The steps below add to a copy of it, so the checkout stays as committed.
          cp -R site _site
          # Each English page also gets its German address (/de/, /de/datenschutz/, …), made from it here, so
          # the repository keeps one copy of every page (tools/language_pages.py).
          python3 tools/language_pages.py build --root _site
          # The brand page's "Download everything" is every file in site/assets/brand/ (tools/export_logos.py),
          # zipped here so the repository keeps each file once. A zip left by a local preview is replaced.
          mkdir -p "$RUNNER_TEMP/kit"
          cp -R site/assets/brand "$RUNNER_TEMP/kit/akari-brand"
          rm -f _site/brand/akari-brand.zip
          (cd "$RUNNER_TEMP/kit" && zip -q -r -X "$GITHUB_WORKSPACE/_site/brand/akari-brand.zip" akari-brand -x '*.DS_Store')
          # The app's export keeps a @3x PNG source next to each WebP; the page only loads the WebP.
          find _site/assets/welcome -name '*@3x.png' -delete
          # The page shows copies of the pieces, icons and stickers with the die-cut edge and shadow baked
          # in. They are made here, from the sources just staged, so the repository keeps only the sources.
          # Anything baked by a local preview is dropped first, so each file is baked and uploaded once.
          find _site/assets -name '*-cut@*.webp' -delete
          rm -rf _site/assets/welcome/stickers/*/ _site/assets/stickers/*/
          python3 -m venv "$RUNNER_TEMP/bake"
          "$RUNNER_TEMP/bake/bin/pip" install --quiet --disable-pip-version-check 'pillow~=12.3'
          "$RUNNER_TEMP/bake/bin/python" tools/bake_die_cuts.py --root _site

      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000
          error_count: 20
