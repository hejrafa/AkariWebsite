<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121313" />
    <meta name="description" content="Sacred Heart — your health has a story to tell." />
    <title>Sacred Heart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero" aria-labelledby="headline">
      <img class="hero-image" src="assets/canyon.png" alt="Desert canyon landscape" />
      <div class="hero-fade" aria-hidden="true"></div>

      <div class="hero-content">
        <h1 id="headline">
          <span>Your <em>health</em></span>
          <span>has a story</span>
          <span><i class="headline-emoji" aria-hidden="true">❤️</i>to tell.</span>
        </h1>
        <a class="glass-button" href="#beta">Join the beta</a>
      </div>

      <footer class="hero-footer" aria-label="Sacred Heart credits">
        <span class="footer-name">Sacred Heart</span>
        <span>Made with <b aria-label="yellow heart">♥</b> in Germany</span>
      </footer>
    </main>
  </body>
</html>
